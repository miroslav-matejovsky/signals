version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

# Third-party packages that components may use via 'canUse'.
vendors:
  yaml: { in: go.yaml.in/yaml/v3 }

components:
  main:         { in: . }
  collection:   { in: collection }
  architecture: { in: architecture }
  detection:    { in: detection }
  attention:    { in: attention }

deps:
  # main is the composition root: it wires the pipeline collection -> detection -> attention.
  main:
    mayDependOn: [collection, architecture, detection, attention]
  architecture:
    canUse: [yaml]
  detection:
    mayDependOn: [collection, architecture]
  attention:
    mayDependOn: [collection, detection]
